<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>UVSQ timetable feed</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 48px auto; padding: 0 20px; line-height: 1.5; }
    .card { border: 1px solid #ddd; border-radius: 16px; padding: 22px; }
    code { background: #f4f4f4; padding: 2px 6px; border-radius: 6px; }
    .ok { color: #137333; } .bad { color: #b3261e; }
    a.button { display:inline-block; padding:10px 14px; border:1px solid #aaa; border-radius:10px; text-decoration:none; }
  </style>
</head>
<body>
  <h1>UVSQ — S5 PHYSIQUE PSC</h1>
  <div class="card">
    <p>This page publishes a calendar feed generated from the UVSQ CELCAT group timetable.</p>
    <p><a class="button" href="schedule.ics">Open / subscribe to schedule.ics</a></p>
    <p id="status">Checking latest update…</p>
  </div>
  <script>
    fetch('status.json', {cache:'no-store'})
      .then(r => r.json())
      .then(s => {
        const when = new Date(s.updated_at).toLocaleString();
        document.querySelector('#status').innerHTML =
          `<strong class="${s.ok ? 'ok' : 'bad'}">${s.ok ? 'Feed healthy' : 'Update failed'}</strong><br>` +
          `Last run: ${when}<br>Events: ${s.event_count}<br>${s.message}`;
      })
      .catch(() => document.querySelector('#status').textContent = 'No status available yet.');
  </script>
</body>
</html>
